name: Send test to Make
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "What to send: a carousel (photo fields) or a reel (video fields)"
        type: choice
        options: [carousel, reel]
        default: carousel
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml requests
      - name: Send one test message to Make
        env:
          POST_WEBHOOK_URL: ${{ secrets.POST_WEBHOOK_URL }}
          MEDIA_BRANCH: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m autopilot test-webhook ${{ inputs.kind == 'reel' && '--reel' || '' }}
