name: Resend posts Make missed
on:
  workflow_dispatch:
    inputs:
      since:
        description: "Resend posts scheduled from this time (Jamaica time), e.g. 2026-11-01T08:30"
        required: true
concurrency:
  group: autopilot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  resend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Mark and resend
        env:
          POST_WEBHOOK_URL: ${{ secrets.POST_WEBHOOK_URL }}
          MEDIA_BRANCH: ${{ github.ref_name }}
        run: |
          python -m autopilot resend --since "${{ github.event.inputs.since }}"
          python -m autopilot publish --catch-up
      - name: Save
        run: |
          git config user.name "arah-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Resend posts"
          git pull --rebase
          git push
