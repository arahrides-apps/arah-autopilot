name: Reset and redraft everything (wipes approved too)
on:
  workflow_dispatch: {}
concurrency:
  group: autopilot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          sudo apt-get update -y && sudo apt-get install -y fonts-inter
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Draft posts (photos, wording, images)
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python -m autopilot index-photos || true
          python -m autopilot prune
          python -m autopilot regenerate --wipe
          python -m autopilot recaption
      - name: Save to repository
        run: |
          git config user.name "arah-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Reset: wipe unpublished posts and redraft on the 12-a-day plan"
          git pull --rebase
          git push
