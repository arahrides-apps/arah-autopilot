name: Renew Instagram token
on:
  schedule:
    - cron: "0 12 * * 1"        # every Monday (the token lasts 60 days, so this keeps it alive)
  workflow_dispatch: {}
concurrency:
  group: autopilot
  cancel-in-progress: false
jobs:
  renew:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: env.HAS_TOKEN == 'true'
        run: pip install pyyaml requests
      - if: env.HAS_TOKEN == 'true'
        name: Ask Instagram for a fresh token
        id: r
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m autopilot refresh-token
      - if: env.HAS_TOKEN == 'true'
        name: Store the new token
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          NEW_TOKEN: ${{ steps.r.outputs.token }}
        run: gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "$NEW_TOKEN"
