name: Reset and redraft everything (wipes approved too)
on:
  workflow_dispatch: {}
concurrency:
  group: autopilot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          sudo apt-get update -y && sudo apt-get install -y fonts-inter ffmpeg
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Draft posts (photos, wording, images)
        timeout-minutes: 58                       # the run itself stops at 40 min to save; this is only a safety net
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_API_KE || secrets.GOOGLE_API_KEY }}
        run: |
          git rm -q --ignore-unmatch autopilot/arahapi.py autopilot/compose.py autopilot/fetch_jtb.py "autopilot/generate 2.py" autopilot/illustrate.py content/index-photos.yml || true   # old code no longer used
          python -m autopilot prune
          python -m autopilot regenerate --wipe
          python -m autopilot recaption
      - name: Save to repository
        if: always()                              # save whatever was finished, even if the step above was stopped
        run: |
          bash scripts/save.sh "Reset: wipe unpublished posts and redraft"
