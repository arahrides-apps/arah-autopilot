name: Fetch JTB images
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: autopilot
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install playwright pillow requests pyyaml
          playwright install --with-deps chromium
      - name: Download new JTB images (stops after 60 minutes, saves what it has; run again to continue)
        env:
          JTB_MINUTES: "60"
        run: python scripts/fetch_jtb.py
      - name: Save to repository (photos/jtb + content/photo_meta_jtb.yaml)
        if: always()
        run: bash scripts/save.sh "JTB photos"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JTB_report
          path: jtb_report.txt
          retention-days: 14
