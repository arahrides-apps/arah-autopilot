name: Draft new posts
on:
  schedule:
    - cron: "13 23 * * *"       # 6:13 pm Jamaica time; the repeats below catch a skipped timer (a day already drafted is left alone)
    - cron: "43 23 * * *"
    - cron: "43 0 * * *"
    - cron: "43 2 * * *"
  workflow_dispatch: {}         # or press "Run workflow" any time
concurrency:
  group: autopilot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          sudo apt-get update -y && sudo apt-get install -y fonts-inter
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Draft posts (photos, wording, images)
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python -m autopilot prune
          python -m autopilot generate
      - name: Save to repository
        run: |
          git config user.name "arah-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Draft posts for review"
          git pull --rebase
          git push
