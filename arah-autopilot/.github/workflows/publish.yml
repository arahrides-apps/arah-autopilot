name: Post approved
on:
  schedule:
    - cron: "*/10 * * * *"      # checks every 10 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not post)"
        type: boolean
        default: false
concurrency:
  group: autopilot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml requests
      - name: Post what is approved and due
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          POST_WEBHOOK_URL: ${{ secrets.POST_WEBHOOK_URL }}
          MEDIA_BRANCH: ${{ github.ref_name }}
          DRY: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY" = "true" ]; then python -m autopilot publish --dry-run; else python -m autopilot publish; fi
      - name: Save results
        run: |
          git config user.name "arah-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Post results"
          git pull --rebase
          git push
