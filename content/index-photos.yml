name: Index new photos
on:
  workflow_dispatch:
    inputs:
      deep:
        description: "Deep search: look at EVERY photo again (JTB, Drive, hand-labelled), compare with free web photos, and have Claude review them"
        type: boolean
        default: true
concurrency:
  group: autopilot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Picture recognition (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install transformers
      - name: Check what is installed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "files in autopilot:"; ls autopilot | tr '\n' ' '; echo
          echo "indexer has deep pass (should be >=1): $(grep -c _retag autopilot/indexer.py || true)"
          echo "vision.py present: $(test -f autopilot/vision.py && echo yes || echo NO)"
          python -c "import torch, transformers; print('torch', torch.__version__, 'transformers', transformers.__version__)" || echo "TORCH/TRANSFORMERS NOT INSTALLED"
          echo "Claude API key set: $(test -n "$ANTHROPIC_API_KEY" && echo yes || echo NO)"
      - name: Index photos (GPS, picture recognition, web comparison, Claude review)
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INDEX_FORCE: ${{ inputs.deep && '1' || '' }}
        run: python -m autopilot index-photos
      - name: Save
        if: always()
        run: |
          git config user.name "arah-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Index photos (deep)"
          git pull --rebase
          git push
