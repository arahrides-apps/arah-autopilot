# Fleet campaign: cars from the lowest daily price to the highest, then the lowest security deposit.
# Three car posts a day (00:00, 02:00, 22:00, late night is when most bookings happen): all 50 models by about Dec 7.
# Built from the fleet list you sent on Nov 20, 2026 (98 rental units grouped into 50 models; airport transfers, boats and 1-day listings left out).
# Rates are base daily rates; holiday and date-specific prices can differ, and the posts say so.
# price / deposit_at_price: the cheapest unit of that model and its deposit (shown together, always from the same unit).
# low_deposit / price_at_low_deposit: the unit with the lowest deposit (used by the low-deposit posts).
# A unit whose deposit was cut off or missing in the list is left out rather than guessed (e.g. Toyota Yaris, listing 159).
# Update this file whenever prices change.
