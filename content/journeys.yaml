# Short stories about the people we want to rent to. Each one becomes a swipeable story post (cover + 3 beats + price + book).
#   k = small label, h = hook on the cover, theme = photo topic, places = a real Jamaica place for each photo (cover, beat 1, 2, 3),
#   beats = three short lines (heading, text), loc = the place tagged on the post.
# Add more any time. Keep each line short and human. No made-up prices or times.
journeys:
