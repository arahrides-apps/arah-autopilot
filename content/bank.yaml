qa:
- q: Where can I pick up my car?
  a: Kingston ArahPro offices, Norman Manley International, Montego Bay local offices, MBJ (Sangster) and OCJ (Ian Fleming).
- q: What is a 1 Day Rental?
  a: Available in Kingston (Windward Road) and at Norman Manley only. Book with 24 hours' notice. No same-day.
- q: Do I need to download an app?
  a: No. Winston works in WhatsApp. Say Hi, get a quote, book and pay by Stripe.
- q: How do I book?
  a: Browse cars on arahrides.com, or say Hi to Winston on WhatsApp at +1 201-371-3152.
- q: How do I pay?
  a: You pay by Stripe when you book. Winston will guide you in WhatsApp.
- q: Is Winston available at night?
  a: Yes. Winston is your 24/7 WhatsApp assistant.
- q: What is Arah Rides?
  a: The Airbnb of car rentals in Jamaica. Pick the car you want and rent Jamaican.
- q: How long can I rent for?
  a: 1 Day Rentals are available in Kingston and at Norman Manley. Other rentals have a 3-day minimum.
- q: Can I pick up at the airport?
  a: Yes. Pickup is available at Norman Manley, MBJ (Sangster) and OCJ (Ian Fleming).
- q: Which side of the road do we drive on?
  a: The left. Keep left, look right at junctions, and take your time on your first day.
- q: What do the speed limit signs show?
  a: Kilometres per hour (km/h). Check your speedometer units before you set off.
- q: Can I book a car for tomorrow?
  a: 1 Day Rentals need 24 hours' notice. Message Winston to plan your dates.
- q: What is Winston's number?
  a: +1 201-371-3152 on WhatsApp. Say Hi and get a quote.
- q: Can I choose my own car?
  a: Yes. Browse the listings on arahrides.com and pick the one you like.
- q: What currency does Jamaica use?
  a: The Jamaican dollar (JMD). Plan a little cash for roadside stops.
- q: What time zone is Jamaica in?
  a: UTC-5 all year. No daylight saving, so the clocks never change.
- q: Can I pick up in Montego Bay?
  a: Yes. Choose MBJ (Sangster) or our local Montego Bay offices.
- q: Can I pick up near Ocho Rios?
  a: Yes. OCJ (Ian Fleming International Airport) is a pickup option.
- q: What is there to do besides the beach?
  a: Waterfalls, river rafting, Blue Mountain coffee, jerk in Portland, reggae in Kingston and plenty more. A car makes it easy.
- q: Why rent a car in Jamaica?
  a: You go on your own timetable. Waterfalls, food stops and hidden beaches are easier with your own wheels.
- q: Where is jerk famous?
  a: Boston Bay in Portland is famous for jerk. Rent a car and make it a food trip.
- q: Where does Blue Mountain coffee grow?
  a: In the Blue Mountains above Kingston. A morning drive up is worth it.
- q: How high is Blue Mountain Peak?
  a: 2,256 metres. It is Jamaica's highest point.
- q: Do I choose my exact car?
  a: Yes. You book the exact car you see on arahrides.com, not a category.
- q: Can I book a car for today?
  a: No. We do not do same-day bookings. Book at least a day ahead and your car will be ready.
- q: Do you have vans for big groups?
  a: Yes. We have 7, 12 and 15 seaters. Supply is limited, so book early.
- q: Can I rent for just one day?
  a: Yes. One-day rentals are available with pickup and drop-off in the Kingston area.
- q: Is there a lounge pass offer?
  a: Book a rental for 7 days or more and get a Club Mobay or Club Kingston departure pass for 1 guest. Conditions apply.
- q: Can I combine the lounge pass with other promos?
  a: No. It cannot be combined with other promo codes or discounts. Conditions apply.
- q: Why book with Arah Rides?
  a: You see the exact car, check its photos and book it. No category guessing at the counter.
- q: Will cars sell out for December?
  a: Supply is limited and the holidays are busy. Book early to secure your exact car.
