# Arah Rides Instagram Autopilot - settings you may want to change.
timezone: America/Jamaica          # UTC-5 all year, no daylight saving
posts_per_day: 12                  # one post every 2 hours, starting at midnight Jamaica time (most reservations are made late at night)
days_ahead: 3                      # keep this many future days drafted for your review
publish_grace_hours: 4             # if a post is still unapproved/undelivered this long after its slot, it is skipped (never posted late)
max_posts_per_day_hard_cap: 15
min_gap_minutes: 20               # posts approved late are spaced at least this far apart
max_posts_per_run: 1              # the publisher runs every 10 minutes

# Times in Jamaica time. Must contain at least posts_per_day entries.
slots: ["00:00", "02:00", "04:00", "06:00", "08:00", "10:00", "12:00", "14:00", "16:00", "18:00", "20:00", "22:00"]   # Jamaica time

# Order of post types inside one day (length = posts_per_day). 'a|b' alternates day by day. Own car photos are limited, so only 1 car post a day.
pattern: ["car_hero", "brand", "chat|qa", "place", "trip", "experience", "review|tip", "place|trip", "carousel|list", "trip|experience", "qa", "chat|trust"]
event_slots: [8, 11]                # pattern positions (16:00 and 22:00) that highlight an upcoming event while one is within 3 weeks; the second only when 2+ events are due
single_slots: [0, 10]               # positions in the pattern posted as a single picture (car_hero at midnight, qa at 20:00); the other 10 of 12 are swipeable carousels
# Night slots (00:00 to 04:00) carry the booking posts: car photo, lounge offer or brand, Winston chat. Day slots carry destination plans, reviews and tips.
# The old 15-a-day pattern, to go back to: ["car_hero", "qa", "experience", "tip", "brand|chat", "carousel|list", "trip", "experience", "tip", "place", "qa|trust|review", "trip", "brand|versus", "place", "list|carousel"]
all_carousels: true               # every feed post is a swipeable carousel (cover + 4 slides); Instagram favours carousels for non-followers
copy_cooldown_days: 30             # same wording is not reused sooner than this (photos follow the stricter rule below)

brand:
  name: Arah Rides
  handle: "@arahrides"
  site: arahrides.com
  whatsapp: "+1 201-371-3152"
  wa_link: "wa.me/12013713152"        # opens a WhatsApp chat with Winston
  price_from: "cars from US$28 a day, SUVs from US$50 a day"   # from Winston's knowledge base; change it here when rates change, or make it "" to show no price
  tagline: "Rent Jamaican. Discover the Real Jamaica."
  green: "#0B6B3A"
  gold: "#E8A93A"
  cream: "#F1ECE0"
  dark: "#1A1F1C"

hashtags:
  max_total: 5                     # Instagram allows at most 5 per post
  # Each post gets 5: the place's own tag + 1-2 for its region + 1 'rent a car' tag + 1 core/brand tag + 1 for the kind of post. They rotate within each group.
  core: ["#ArahRides", "#RentJamaican", "#DiscoverTheRealJamaica"]
  rent: ["#JamaicaCarRental", "#RentACarJamaica", "#CarRentalJamaica", "#SelfDriveJamaica", "#AirportPickupJamaica", "#JamaicaRentalCar"]
  discover: ["#VisitJamaica", "#TravelJamaica", "#JamaicaTravel", "#JamaicaItinerary", "#JamaicaRoadTrip", "#JamaicaVacation"]
  region:                          # keys are the regions in content/stories.yaml
    kingston: ["#KingstonJamaica", "#KingstonCarRental", "#NormanManleyAirport", "#BlueMountainsJamaica"]
    portland: ["#PortlandJamaica", "#PortAntonio", "#BostonBay", "#ReachFalls", "#WinnifredBeach"]
    north coast: ["#OchoRios", "#OchoRiosJamaica", "#DunnsRiverFalls", "#BlueHoleJamaica", "#IanFlemingAirport"]
    west: ["#NegrilJamaica", "#SevenMileBeach", "#NegrilSunset", "#NegrilCarRental", "#BluefieldsBeach"]
    montego bay: ["#MontegoBay", "#MontegoBayCarRental", "#SangsterAirport", "#MBJAirport", "#HipStripMontegoBay"]
    south coast: ["#SouthCoastJamaica", "#TreasureBeach", "#YSFalls", "#BlackRiverJamaica", "#StElizabethJamaica"]
  place_tags:                      # a tag for the exact place, used first when the post is about it
    reach falls: "#ReachFalls"
    winnifred beach: "#WinnifredBeach"
    boston bay: "#BostonBay"
    port antonio: "#PortAntonio"
    seven mile beach: "#SevenMileBeach"
    dunn's river falls: "#DunnsRiverFalls"
    blue hole: "#BlueHoleJamaica"
    ys falls: "#YSFalls"
    black river: "#BlackRiverJamaica"
    treasure beach: "#TreasureBeach"
    bamboo avenue: "#BambooAvenue"
    negril: "#NegrilJamaica"
    ocho rios: "#OchoRios"
    kingston: "#KingstonJamaica"
    bluefields beach: "#BluefieldsBeach"
    manchioneal: "#Manchioneal"
  by_type:
    experience: ["#JamaicaTravel", "#ExploreJamaica", "#JamaicaVacation"]
    place: ["#ExploreJamaica", "#JamaicaTravel", "#VisitJamaica"]
    carousel: ["#JamaicaTravelTips", "#RoadTripJamaica", "#TravelJamaica"]
    trip: ["#RoadTripJamaica", "#JamaicaTravelTips", "#TravelJamaica"]
    tip: ["#JamaicaTravelTips", "#DrivingInJamaica", "#TravelTips"]
    list: ["#JamaicaTravelTips", "#TravelJamaica", "#JamaicaVacation"]
    car_hero: ["#RoadTripJamaica", "#SUVRentalJamaica", "#CarRentalJamaica"]
    review: ["#JamaicaCarRental", "#RentACarJamaica", "#CarRentalJamaica"]
    offer: ["#JamaicaVacation", "#JamaicaTravel", "#AirportPickupJamaica"]
    moment: ["#VisitJamaica", "#ExploreJamaica", "#JamaicaEvents"]
    chat: ["#CarRentalJamaica", "#JamaicaTravelTips", "#TravelJamaica"]
    qa: ["#JamaicaTravelTips", "#CarRentalJamaica", "#TravelJamaica"]

# Locations tagged on posts. Each post is tagged with a real place so it can show up in that place's page and in search.
# id = the Facebook/Instagram place ID for the tag (optional: leave "" until you have it; the post still goes out, just without the pin).
# kw = the line added to the caption so Instagram search finds the post.
locations:
  default_rotation: [kingston, montego_bay, norman_manley, sangster, ocho_rios]
  kingston:       {name: "Kingston, Jamaica",                        id: "109489972411518", tag: "#KingstonJamaica",      kw: "Car rental in Kingston, Jamaica | Pickup at Norman Manley Airport"}
  montego_bay:    {name: "Montego Bay, Jamaica",                     id: "115773858436055", tag: "#MontegoBayJamaica",    kw: "Car rental in Montego Bay, Jamaica | Airport pickup"}
  norman_manley:  {name: "Norman Manley International Airport",     id: "583154638527853", tag: "#NormanManleyAirport",  kw: "Car rental at Norman Manley Airport, Kingston | Airport pickup"}
  sangster:       {name: "Sangster International Airport",          id: "106111078512570", tag: "#SangsterAirport",      kw: "Car rental at Sangster Airport, Montego Bay | Airport pickup"}
  ocho_rios:      {name: "Ocho Rios, Jamaica",                       id: "111964835488149", tag: "#OchoRios",             kw: "Car rental for Ocho Rios and the north coast"}
  # Extra places (optional). A post about one of these tags it only when its id is filled in; otherwise it uses one of the five above that has an id.
  negril:         {name: "Negril, Jamaica",                          id: "110074689016001", tag: "#NegrilJamaica",        kw: "Car rental for Negril, Jamaica | Pickup at MBJ"}
  # Verified Meta place IDs. "match" = words in a post's place name that pick this tag.
  ian_fleming:    {name: "Ian Fleming International Airport",         id: "166559740056858", tag: "#IanFlemingAirport",   kw: "Car rental near Ian Fleming Airport, Ocho Rios | Airport pickup", match: ["ian fleming", "boscobel"]}
  dunns_river:    {name: "Dunns River Falls and Beach",              id: "115498645267334", tag: "#DunnsRiverFalls",     kw: "Car rental for Dunn's River Falls, Ocho Rios", match: ["dunn"]}
  seven_mile:     {name: "Negril Seven Mile Beach",                  id: "481929168524298", tag: "#SevenMileBeach",      kw: "Car rental for Seven Mile Beach, Negril", match: ["seven mile", "7 mile"]}
  ricks_cafe:     {name: "Rick's Cafe",                              id: "180299872028723", tag: "#RicksCafe",           kw: "Car rental for Negril and Rick's Cafe sunsets", match: ["rick"]}
  doctors_cave:   {name: "Doctor's Cave Beach",                      id: "108275249199808", tag: "#DoctorsCaveBeach",    kw: "Car rental for Doctor's Cave Beach, Montego Bay", match: ["doctor"]}
  port_antonio:   {name: "Port Antonio, Jamaica",                    id: "110674215620951", tag: "#PortAntonio",          kw: "Car rental for Port Antonio and Portland, Jamaica"}
  treasure_beach: {name: "Treasure Beach, Jamaica",                  id: "109565452394927", tag: "#TreasureBeach",        kw: "Car rental for Treasure Beach and the south coast"}

reels:
  per_day: 0                       # (set to 4 tonight) this many of each day's carousels go out as Reels (video). 0 = none
  library: true                   # one a day uses an animated ad from content/reels/
  publish_as_reel: false          # true = post the video. Turn on only after the Make scenario has a Reel branch (see SETUP); false = still post the carousels

photos:
  reuse_days: 90                   # the same photo is never used again within this many days
  near_duplicate_days: 30          # a near-identical shot (burst photos) is also held back this long
  near_duplicate_distance: 10
  web_share: 0.5                   # share of scenery posts that look for a licence-free web photo first (0 = own photos first, 1 = web first)
  illustrations: false             # real photos only. true = allow drawn placeholder scenes when no photo can be found
  stock_car_share: 0.35            # share of car posts that use a clean stock photo of one of our models (needs the Pexels / Unsplash / Pixabay keys)
  fleet_models: [BMW 2 Series, BMW 3 Series, BMW 5 Series GT, Foton View CS2, GWM Haval GT, GWM Haval H6, Honda CR-V, Honda Fit, Honda Grace, Honda HR-V, Hyundai Creta, Hyundai Tucson, Jetour T2, Kia Cerato, Kia Seltos, Kia Soluto, Kia Sportage, Mazda Demio, MG ZS, Nissan Sylphy, Nissan Teana, Nissan X-Trail, Subaru G4, Subaru Impreza, Subaru Legacy, Subaru XV, Suzuki Baleno, Suzuki Swift, Suzuki Vitara, Suzuki XL7, Toyota Aqua, Toyota Axio, Toyota Corolla, Toyota Corolla Cross, Toyota Corolla Touring, Toyota Hiace, Toyota Noah, Toyota RAV4, Toyota Rush, Toyota Vitz, Toyota Voxy, Toyota Yaris, Toyota Yaris Cross]     # the models on arahrides.com
  series_days: 14                  # photos from the same shoot (same car, same spot) are spaced at least this many days apart
  min_short_side: 1000
  allow_unreviewed_drive: false    # true = also use Drive photos I have not looked at. Only switch on after checking the Drive folder holds nothing private
  allow_people_scenery: true       # Jamaica scenery/lifestyle photos may show people (couples, families, groups). Car photos still follow the next line
  allow_people_photos: false       # photos with identifiable people stay out unless content/photo_meta.yaml says consent: true

sources:
  drive:
    enabled: true
    folder_ids: ["1IDnQxdig0etzbxv_Z98iotUDpi9HiFg3"]   # Arah Rides Content (sub-folders are scanned too)
    service_account_env: GDRIVE_SA_JSON                  # GitHub secret holding the service account key
    max_download_mb: 40
  local:
    enabled: true
    dir: photos                                          # optional: drop extra photos here
  unsplash:
    enabled: true                                        # free key: unsplash.com/developers (New Application > Access Key)
    api_key_env: UNSPLASH_ACCESS_KEY
  pexels:
    enabled: true                                        # free key: pexels.com/api
    api_key_env: PEXELS_API_KEY
  pixabay:
    enabled: true                                        # free key: pixabay.com/api/docs  (secret PIXABAY_API_KEY)
    api_key_env: PIXABAY_API_KEY
  wikimedia:
    enabled: true                                        # Wikimedia Commons, no key; only public-domain / CC0 files are used
  openverse:
    enabled: true                                        # needs free credentials (OPENVERSE_CLIENT_ID / SECRET); skipped without them
    licenses: "cc0,pdm"

# Offers I could not confirm. Posts about them stay OFF until you fill the text and enable them.
offers:
  lounge_pass:
    enabled: true
    text: "Book a rental for 7 days or more and get a Club Mobay or Club Kingston departure pass for 1 guest. Cannot be combined with other promo codes or discounts. Conditions apply."
    buy_url: "https://booking.vipattractions.com/affiliate/8285"     # buy a lounge pass without renting
  black_friday:
    enabled: false
    text: ""        # waiting for the terms
  smile_jamaica:
    enabled: true
    url: "https://youtu.be/vMKRKG8bN-8"

instagram:
  api_host: "https://graph.instagram.com"   # Instagram API with Instagram Login
  api_version: "v21.0"
  user_id_env: IG_USER_ID
  token_env: IG_ACCESS_TOKEN
